const list=Object.entries(rooms).filter(([k,v])=>v&&now-(v.t||0)<25000).sort((a,b)=>(b[1].n||0)-(a[1].n||0));
if(!list.length){const d=document.createElement("div");d.className="le";d.textContent=T.none;box.appendChild(d);return}
for(const[k,v]of list){const r=document.createElement("div");r.className="lr";
const a=document.createElement("span");a.textContent="🏠 "+k;const b=document.createElement("span");b.textContent="👥 "+(v.n|0)+" "+T.pl;
r.append(a,b);r.onclick=()=>{$("rm").value=k;$("gbtn").click()};box.appendChild(r)}};
onValue(ref(db,"rooms"),s=>{rooms=s.val()||{};draw()},()=>{$("lobby").style.display="none"});
setInterval(draw,5000);$("lbr").onclick=draw;
let mine=null;
const unreg=()=>{if(mine){const r=ref(db,"rooms/"+mine);mine=null;remove(r).catch(()=>{})}};
const beat=()=>{const st=window.lunaState&&window.lunaState();
if(st&&st.st==="Anfitrión"&&st.room&&st.room.length<=20){
if(mine&&mine!==st.room)unreg();
const r=ref(db,"rooms/"+st.room);
if(mine!==st.room){mine=st.room;onDisconnect(r).remove()}
set(r,{n:st.n|0,t:Date.now()+off}).catch(()=>{})
}else unreg()};
setInterval(beat,8000);beat();
addEventListener("pagehide",unreg);
}catch(e){console.warn("Lobby no disponible",e);const l=document.getElementById("lobby");l&&(l.style.display="none")}})();
</script>
</body></html>
